name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowgraph-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flowgraph-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc strict)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build extension (bridge + vite)
        run: npm run build
