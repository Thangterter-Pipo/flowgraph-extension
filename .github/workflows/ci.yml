name: CI

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + Tests + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowgraph-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flowgraph-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test -- --run --reporter=verbose

      - name: Build extension (bridge + vite)
        run: npm run build

      - name: Verify dist exists
        run: |
          test -d dist && echo "✅ dist/ exists" || (echo "❌ dist/ missing" && exit 1)
          ls -lh dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: flowgraph-extension-dist-${{ github.sha }}
          path: flowgraph-extension/dist/
          retention-days: 30
