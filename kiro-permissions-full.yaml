# Kiro Trust v2 - permissions cap user (ap dung cho MOI workspace)
# Che do: FULL AUTONOMY - khong hoi xac nhan.
#
# QUAN TRONG - vi sao KHONG dung "match":
# PolicyEngine.evaluateShell() co duong tat: neu shell duoc allow VO DIEU KIEN
# thi cho phep ngay, bo qua buoc parse lenh bang tree-sitter.
# Mot rule chi tinh la "vo dieu kien" khi:
#     - khong co "match", HOAC
#     - "match" rong, HOAC
#     - "match" co DUNG 1 phan tu va phan tu do la "*"
# Danh sach match dai (du co chua "*") KHONG tinh -> lenh van bi parse ->
# lenh PowerShell phuc tap parse loi -> effect: ask.
#
# Vi vay tat ca rule duoi day deu KHONG co "match".
#
# Luu y: dung thêm rule shell nao co effect "deny" hoac "ask".
# Chi mot rule nhu vay la duong tat bi tat, va cac lenh parse loi se hoi lai.
#
# effect hop le: allow | deny | ask

rules:
  # Gom toan bo builtin capabilities + mcp
  - capability: all
    effect: allow

  # Khai bao tuong minh tung capability (vo dieu kien)
  - capability: shell
    effect: allow
  - capability: fs_read
    effect: allow
  - capability: fs_write
    effect: allow
  - capability: web_fetch
    effect: allow
  - capability: web_search
    effect: allow
  - capability: mcp
    effect: allow
  - capability: subagent
    effect: allow
  - capability: skill
    effect: allow
  - capability: power
    effect: allow
  - capability: context
    effect: allow
  - capability: diagnostics
    effect: allow
  - capability: sandbox_network
    effect: allow
